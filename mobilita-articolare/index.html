<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MonkeyLab — Mobilità articolare</title>
<style>
:root{--bg:#07110D;--fg:#F4F1E7;--muted:#B8BDB8;--green:#1A6D33;--hi:#A4D43D;--panel:#0B2A1D}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 14px 28px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.header h1{font-size:17px;line-height:1.25;margin:0;font-weight:650}.counter{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}.stage{display:grid;grid-template-columns:52px minmax(0,540px) 52px;align-items:center;justify-content:center;gap:12px}.frame{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:18px;background:#111;box-shadow:0 18px 45px rgba(0,0,0,.35);touch-action:pan-y}.frame img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}button{border:0;border-radius:999px;background:var(--panel);color:var(--fg);width:48px;height:48px;font-size:27px;cursor:pointer}button:disabled{opacity:.35}.dots{display:flex;justify-content:center;gap:8px;margin:16px 0}.dot{width:9px;height:9px;border-radius:50%;background:#59605c;cursor:pointer}.dot.active{background:var(--hi);transform:scale(1.18)}.thumbs{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.thumb{border:2px solid transparent;border-radius:9px;overflow:hidden;cursor:pointer;opacity:.7;background:#111}.thumb.active{border-color:var(--hi);opacity:1}.thumb img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.hint{color:var(--muted);font-size:13px;text-align:center;margin:14px 0 0}.error{display:none;position:absolute;inset:0;padding:24px;align-items:center;justify-content:center;text-align:center;color:var(--fg);background:#111}.error.show{display:flex}@media(max-width:760px){.wrap{padding:10px 8px 22px}.header h1{font-size:14px}.stage{grid-template-columns:38px minmax(0,1fr) 38px;gap:5px}button{width:36px;height:36px;font-size:20px}.thumbs{grid-template-columns:repeat(4,1fr);gap:7px}.frame{border-radius:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Mobilità articolare come fondamento per un movimento libero</h1><div class="counter" id="counter">1 / 8</div></div>
  <div class="stage">
    <button id="prev" aria-label="Slide precedente">‹</button>
    <div class="frame" id="frame"><img id="main" alt="Slide 1"><div class="error" id="error">Immagine non disponibile. Apri Google Drive con l’account MonkeyLab e ricarica la pagina.</div></div>
    <button id="next" aria-label="Slide successiva">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="thumbs" id="thumbs"></div>
  <p class="hint">Pulsanti, frecce ← →, miniature oppure swipe sull’immagine.</p>
</div>
<script>
const ids=['1ZIuM1-Gy9pyEs3JdhuqhadS1-4NFHGgS','1XOBz4PkM9FNiFvAJ61P4rhrb5NPwUMk8','14h-Z-8YEZ7JUotu75eNnqn9Z9skWPTk-','1yCSiVDpsurHKwS0vFXrcD5bWmM79_da1','13CKpHtPCPXx9LbmRqzNal1YGLRE5jNU-','1MndhDjWXxjYdHBCpX4lo2LE3gQwnLKX6','1Y3_oei0JmZn1EHtyOHvCXcG6nuvdJ6qA','1ezbkDo_s7Y-5z8FfLuFZGodXSfSgbtT7'];
const slides=ids.map(id=>`https://drive.google.com/thumbnail?id=${id}&sz=w1080`);
let index=0;const main=document.getElementById('main'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),frame=document.getElementById('frame'),dots=document.getElementById('dots'),thumbs=document.getElementById('thumbs'),error=document.getElementById('error');
slides.forEach((src,i)=>{const d=document.createElement('span');d.className='dot';d.onclick=()=>go(i);dots.appendChild(d);const t=document.createElement('div');t.className='thumb';const im=document.createElement('img');im.src=src;im.alt=`Miniatura ${i+1}`;t.appendChild(im);t.onclick=()=>go(i);thumbs.appendChild(t)});
function go(i){index=Math.max(0,Math.min(slides.length-1,i));error.classList.remove('show');main.src=slides[index];main.alt=`Slide ${index+1}`;counter.textContent=`${index+1} / ${slides.length}`;prev.disabled=index===0;next.disabled=index===slides.length-1;[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===index));[...thumbs.children].forEach((t,j)=>t.classList.toggle('active',j===index))}
main.onerror=()=>error.classList.add('show');prev.onclick=()=>go(index-1);next.onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(index-1);if(e.key==='ArrowRight')go(index+1)});let startX=null;frame.addEventListener('pointerdown',e=>{startX=e.clientX;frame.setPointerCapture(e.pointerId)});frame.addEventListener('pointerup',e=>{if(startX===null)return;const dx=e.clientX-startX;startX=null;if(Math.abs(dx)>40)dx<0?go(index+1):go(index-1)});go(0);
</script>
</body></html>
